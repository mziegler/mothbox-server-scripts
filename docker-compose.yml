# Shared configuration applied to both services via YAML anchor
x-common: &common
  build: .
  network_mode: host   # inherits host Tailscale interface; Mothbox IPs are reachable
  restart: always
  volumes:
    - /home/mb/mothbox-photos:/home/mb/mothbox-photos
    - /home/mb/mothbox-metadata:/home/mb/mothbox-metadata
    - /home/mb/species-lists:/home/mb/species-lists
    #- /home/mb/Mothbot_Process/trained_models:/home/mb/Mothbot_Process/trained_models:ro
    - /home/mb/.config/rclone:/home/mb/.config/rclone:ro
    - /home/mb/.ssh:/home/mb/.ssh:ro
    - /home/mb/logs:/home/mb/logs

services:
  # Pulls photos from Mothbox devices every minute during the nightly
  # collection window defined in mothboxServerConfig.py.
  rsync:
    <<: *common
    entrypoint: ["python3", "rsync_daemon.py"]

  # Processes incoming photo folders through the AI pipeline.
  # Sleeps when idle; drains backlogs continuously when work is available.
  # Memory capped slightly above the per-subprocess RLIMIT_AS (12 GB) to
  # leave headroom for the Python orchestrator.
  pipeline:
    <<: *common
    mem_limit: 14g
    memswap_limit: 14g
    entrypoint: ["python3", "-m", "photoprocessing.pipeline_schedule_manager"]
