server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static app shell (index.html, style.css, app.js) -- committed to the
    # repo, changes only on deploy, safe to cache briefly at the edge.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Per-device photos written by livestream.py. Keep max-age in sync with
    # LIVESTREAM_REFRESH_SECONDS in mothboxServerConfig.py.
    location ~* ^/data/.*\.(jpg|jpeg|png)$ {
        add_header Cache-Control "public, max-age=20";
    }

    # Device status/schedule data written by livestream.py. Shorter TTL than
    # the images -- it's tiny and drives the outage indicator, so keep it
    # fresher than the (bandwidth-heavier) photos.
    location = /data/mothboxes.json {
        add_header Cache-Control "public, max-age=10";
        default_type application/json;
    }
}
