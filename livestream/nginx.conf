server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Keep max-age in sync with LIVESTREAM_REFRESH_SECONDS in mothboxServerConfig.py.
    location ~* \.(jpg|jpeg|png)$ {
        add_header Cache-Control "public, max-age=60";
    }
}
